<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text-title { font-family: 'Segoe UI', Inter, sans-serif; font-size: 16px; font-weight: 700; fill: #1A365D; }
      .text-sub { font-family: 'Segoe UI', Inter, sans-serif; font-size: 11px; font-weight: 600; fill: #64748B; }
      .text-menu { font-family: 'Segoe UI', Inter, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .text-menu-active { font-family: 'Segoe UI', Inter, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .text-body { font-family: 'Segoe UI', Inter, sans-serif; font-size: 13px; fill: #1E293B; }
      .text-muted { font-family: 'Segoe UI', Inter, sans-serif; font-size: 12px; fill: #64748B; }
      .text-kpi-val { font-family: 'Segoe UI', Inter, sans-serif; font-size: 26px; font-weight: 800; fill: #1A365D; }
    </style>
  </defs>

  <!-- Fondo General -->
  <rect width="1440" height="900" fill="#F8FAFC"/>
  <!-- Franja Superior Accent -->
  <rect width="1440" height="4" fill="#2B6CB0"/>

  <!-- SIDEBAR (260px) -->
  <rect x="0" y="4" width="260" height="896" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Brand Sidebar -->
  <rect x="20" y="24" width="38" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <path d="M28 48V28H48V48H28Z" stroke="#1A365D" stroke-width="2" fill="none"/>
  <rect x="33" y="32" width="3" height="3" fill="#1A365D"/>
  <rect x="40" y="32" width="3" height="3" fill="#1A365D"/>
  <rect x="33" y="38" width="3" height="3" fill="#1A365D"/>
  <rect x="40" y="38" width="3" height="3" fill="#1A365D"/>

  <text x="68" y="40" class="text-title" style="font-size: 16px;">FinanCorp SERF</text>
  <text x="68" y="55" class="text-sub">FISCAL RISK &amp; REPORTING</text>
  <line x1="0" y1="76" x2="260" y2="76" stroke="#E2E8F0"/>

  <!-- Items del Menú Vertical -->
  <!-- ITEM 1: Resumen y Configuración (ACTIVO) -->
  <rect x="0" y="86" width="260" height="44" fill="#1A365D"/>
  <rect x="0" y="86" width="4" height="44" fill="#3182CE"/>
  <!-- Icono Grid -->
  <rect x="20" y="98" width="7" height="7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <rect x="31" y="98" width="7" height="7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <rect x="20" y="109" width="7" height="7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <rect x="31" y="109" width="7" height="7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="48" y="113" class="text-menu-active">Resumen y Configuración</text>

  <!-- ITEM 2: Módulo 1 -->
  <!-- Icono Caja -->
  <path d="M20 152L29 147L38 152V163L29 168L20 163V152Z" stroke="#475569" stroke-width="1.8" fill="none"/>
  <text x="48" y="161" class="text-menu">Módulo 1: Productos Importados</text>

  <!-- ITEM 3: Módulo 2 -->
  <!-- Icono Tienda -->
  <path d="M20 198L22 193H36L38 198V208H20V198Z" stroke="#475569" stroke-width="1.8" fill="none"/>
  <text x="48" y="204" class="text-menu">Módulo 2: Ventas en Filiales</text>

  <!-- ITEM 4: Módulo 3 -->
  <!-- Icono Reportes -->
  <line x1="22" y1="248" x2="22" y2="240" stroke="#475569" stroke-width="2"/>
  <line x1="28" y1="248" x2="28" y2="234" stroke="#475569" stroke-width="2"/>
  <line x1="34" y1="248" x2="34" y2="242" stroke="#475569" stroke-width="2"/>
  <text x="48" y="246" class="text-menu">Módulo 3: Reportes Financieros</text>

  <!-- TOPBAR -->
  <rect x="260" y="4" width="1180" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="288" y="39" class="text-title" style="font-size: 15px;">FinanCorp S.A. - Sistema SERF (Sede Perú)</text>
  <rect x="610" y="24" width="105" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="618" y="39" class="text-sub" style="fill: #2B6CB0;">MULTINACIONAL B2B</text>

  <!-- Widget de Tasas Oficiales (Header) -->
  <rect x="940" y="18" width="460" height="34" rx="6" fill="#1A365D"/>
  <rect x="948" y="23" width="90" height="24" rx="4" fill="#2B6CB0"/>
  <text x="956" y="39" style="font-family:'Segoe UI', sans-serif; font-size:10px; font-weight:800; fill:#FFF;">TASAS OFICIALES</text>
  <text x="1050" y="39" style="font-family:'Segoe UI', sans-serif; font-size:12px; font-weight:600; fill:#F1F5F9;">1 EUR = 4.13 PEN | 1 EUR = 7.82 CNY | 1 EUR = 1.08 USD</text>

  <!-- CONTENIDO: Resumen Ejecutivo y Configuración -->
  <!-- 4 KPI Cards -->
  <g transform="translate(288, 88)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="265" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#1A365D"/>
    <text x="18" y="28" class="text-sub">INGRESOS CONSOLIDADOS</text>
    <text x="18" y="62" class="text-kpi-val">8,627.12 €</text>
    <text x="18" y="82" class="text-muted">Ventas unificadas filiales</text>

    <!-- Card 2 -->
    <rect x="285" y="0" width="265" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="285" y="0" width="4" height="96" rx="2" fill="#2B6CB0"/>
    <text x="303" y="28" class="text-sub">INVERSIÓN IMPORTACIÓN</text>
    <text x="303" y="62" class="text-kpi-val">27,979.54 €</text>
    <text x="303" y="82" class="text-muted">Lotes Shenzhen (China)</text>

    <!-- Card 3 -->
    <rect x="570" y="0" width="265" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="570" y="0" width="4" height="96" rx="2" fill="#0D9488"/>
    <text x="588" y="28" class="text-sub">MARGEN OPERATIVO BRUTO</text>
    <text x="588" y="62" class="text-kpi-val" style="fill: #0D9488;">+34.8 %</text>
    <text x="588" y="82" class="text-muted">Rentabilidad unificada EUR</text>

    <!-- Card 4 -->
    <rect x="855" y="0" width="265" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="855" y="0" width="4" height="96" rx="2" fill="#854D0E"/>
    <text x="873" y="28" class="text-sub">FILIALES ACTIVAS</text>
    <text x="873" y="62" class="text-kpi-val">3</text>
    <text x="873" y="82" class="text-muted">Perú, Chile, Europa</text>
  </g>

  <!-- Tarjetas Dobles: Configuración Singleton & Filiales -->
  <g transform="translate(288, 208)">
    <!-- Config Singleton -->
    <rect x="0" y="0" width="550" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="550" height="44" rx="8" fill="#FAFAFC"/>
    <text x="20" y="27" class="text-title" style="font-size:14px;">Configuración Corporativa Global (Singleton)</text>
    <rect x="440" y="11" width="95" height="22" rx="4" fill="#F3E8FF"/>
    <text x="448" y="26" class="text-sub" style="fill:#6B21A8;">INSTANCIA ÚNICA</text>

    <text x="20" y="70" class="text-muted">Tasa Oficial PEN frente a 1 EUR (Perú):</text>
    <rect x="20" y="82" width="245" height="36" rx="6" fill="#FFF" stroke="#E2E8F0"/>
    <text x="32" y="105" class="text-body" style="font-weight:600;">4.1300</text>

    <text x="285" y="70" class="text-muted">Tasa Oficial CNY frente a 1 EUR (China):</text>
    <rect x="285" y="82" width="245" height="36" rx="6" fill="#FFF" stroke="#E2E8F0"/>
    <text x="297" y="105" class="text-body" style="font-weight:600;">7.8200</text>

    <text x="20" y="145" class="text-muted">Tasa Oficial USD frente a 1 EUR (Chile / Global):</text>
    <rect x="20" y="157" width="510" height="36" rx="6" fill="#FFF" stroke="#E2E8F0"/>
    <text x="32" y="180" class="text-body" style="font-weight:600;">1.0800</text>

    <rect x="20" y="215" width="240" height="38" rx="6" fill="#2B6CB0"/>
    <text x="42" y="239" style="font-family:'Segoe UI', sans-serif; font-size:13px; font-weight:700; fill:#FFF;">✓ Actualizar Tasas (Singleton)</text>
  </g>

  <g transform="translate(858, 208)">
    <!-- Filiales -->
    <rect x="0" y="0" width="550" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="550" height="44" rx="8" fill="#FAFAFC"/>
    <text x="20" y="27" class="text-title" style="font-size:14px;">Filiales Registradas en FinanCorp S.A.</text>

    <!-- Filial 1 -->
    <rect x="20" y="60" width="510" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="36" y="85" class="text-body" style="font-weight:700;">Filial Perú</text>
    <text x="36" y="102" class="text-muted">Moneda operativa: Soles (PEN) • Conversión: 1 EUR = 4.13 PEN</text>
    <rect x="450" y="78" width="60" height="20" rx="4" fill="#DCFCE7"/>
    <text x="462" y="92" class="text-sub" style="fill:#15803D;">ACTIVA</text>

    <!-- Filial 2 -->
    <rect x="20" y="128" width="510" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="36" y="153" class="text-body" style="font-weight:700;">Filial Chile</text>
    <text x="36" y="170" class="text-muted">Moneda operativa: Dólares (USD) • Conversión: 1 EUR = 1.08 USD</text>
    <rect x="450" y="146" width="60" height="20" rx="4" fill="#DCFCE7"/>
    <text x="462" y="160" class="text-sub" style="fill:#15803D;">ACTIVA</text>

    <!-- Filial 3 -->
    <rect x="20" y="196" width="510" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="36" y="221" class="text-body" style="font-weight:700;">Sede Central Europa</text>
    <text x="36" y="238" class="text-muted">Moneda base corporativa: Euros (EUR) • Consolidación B2B</text>
    <rect x="430" y="214" width="80" height="20" rx="4" fill="#E0F2FE"/>
    <text x="440" y="228" class="text-sub" style="fill:#0369A1;">PRINCIPAL</text>
  </g>

  <!-- Tabla de Ventas Recientes -->
  <g transform="translate(288, 510)">
    <rect x="0" y="0" width="1120" height="250" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="1120" height="42" rx="8" fill="#FAFAFC"/>
    <text x="20" y="26" class="text-title" style="font-size:14px;">Últimas Ventas Registradas en Filiales</text>

    <!-- Table Header -->
    <rect x="20" y="55" width="1080" height="32" fill="#F1F5F9"/>
    <text x="36" y="76" class="text-sub">FACTURA</text>
    <text x="200" y="76" class="text-sub">FILIAL</text>
    <text x="400" y="76" class="text-sub">PRODUCTO</text>
    <text x="750" y="76" class="text-sub">TOTAL LOCAL</text>
    <text x="950" y="76" class="text-sub">TOTAL EUR</text>

    <!-- Row 1 -->
    <text x="36" y="112" class="text-body" style="font-weight:700;">B001-000412</text>
    <text x="200" y="112" class="text-body">Filial Perú</text>
    <text x="400" y="112" class="text-body">Laptop ThinkEnterprise X1 (3 unids)</text>
    <text x="750" y="112" class="text-body">12,600.00 PEN</text>
    <text x="950" y="112" class="text-body" style="font-weight:700; fill:#1A365D;">3,050.85 €</text>
    <line x1="20" y1="126" x2="1100" y2="126" stroke="#E2E8F0"/>

    <!-- Row 2 -->
    <text x="36" y="152" class="text-body" style="font-weight:700;">F002-000881</text>
    <text x="200" y="152" class="text-body">Filial Chile</text>
    <text x="400" y="152" class="text-body">Router Enterprise Gigabit AX3000 (4 unids)</text>
    <text x="750" y="152" class="text-body">600.00 USD</text>
    <text x="950" y="152" class="text-body" style="font-weight:700; fill:#1A365D;">555.56 €</text>
    <line x1="20" y1="166" x2="1100" y2="166" stroke="#E2E8F0"/>

    <!-- Row 3 -->
    <text x="36" y="192" class="text-body" style="font-weight:700;">B001-000413</text>
    <text x="200" y="192" class="text-body">Filial Perú</text>
    <text x="400" y="192" class="text-body">Smartphone FinanPro 5G (5 unids)</text>
    <text x="750" y="192" class="text-body">10,500.00 PEN</text>
    <text x="950" y="192" class="text-body" style="font-weight:700; fill:#1A365D;">2,542.37 €</text>
  </g>
</svg>
