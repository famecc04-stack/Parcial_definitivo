    <rect x="24" y="335" width="1072" height="85" rx="6" fill="#FAFAFC" stroke="#E2E8F0"/>
    <rect x="24" y="335" width="1072" height="30" fill="#F1F5F9"/>
    <text x="38" y="355" class="text-body" style="font-weight:700; fill:#1A365D;">3. Gastos de Importación (Shenzhen - China)</text>
    <text x="1080" y="355" text-anchor="end" class="text-body" style="font-weight:700; fill:#E11D48;">27,979.54 €</text>
    <text x="38" y="390" class="text-body">Lotes Shenzhen: Laptop X1 (13,235.29 €) | Smartphone 5G (11,253.20 €) | Routers (2,109.97 €)</text>

