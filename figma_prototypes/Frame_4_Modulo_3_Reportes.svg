    <rect x="24" y="135" width="1072" height="30" fill="#F1F5F9"/>
    <text x="38" y="155" class="text-body" style="font-weight:700; fill:#1A365D;">1. Ingresos por Filial / País (EUR)</text>
    <text x="1080" y="155" text-anchor="end" class="text-body" style="font-weight:700; fill:#2B6CB0;">8,627.12 €</text>
    <text x="38" y="190" class="text-body">Filial Perú: 7,627.12 €</text>
    <text x="400" y="190" class="text-body">Filial Chile: 1,000.00 €</text>

