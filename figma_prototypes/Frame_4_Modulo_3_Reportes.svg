  <text x="68" y="40" class="text-title" style="font-size: 16px;">FinanCorp SERF</text>
  <text x="68" y="55" class="text-sub">FISCAL RISK &amp; REPORTING</text>
  <line x1="0" y1="76" x2="260" y2="76" stroke="#E2E8F0"/>

  <!-- Items del Menú -->
  <!-- ITEM 1 -->
  <rect x="20" y="98" width="7" height="7" stroke="#475569" stroke-width="1.8" fill="none"/>
  <rect x="31" y="98" width="7" height="7" stroke="#475569" stroke-width="1.8" fill="none"/>
  <rect x="20" y="109" width="7" height="7" stroke="#475569" stroke-width="1.8" fill="none"/>
  <rect x="31" y="109" width="7" height="7" stroke="#475569" stroke-width="1.8" fill="none"/>
  <text x="48" y="113" class="text-menu">Resumen y Configuración</text>

