    <rect x="24" y="445" width="1072" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="65" cy="487" r="22" fill="#1A365D"/>
    <text x="65" y="493" text-anchor="middle" style="font-size:18px; fill:#FFF;">✓</text>
    
    <text x="105" y="475" class="text-body" style="font-weight:800; font-size:15px; fill:#1A365D;">Fabiola Cadillo / Estefanía Orellana</text>
    <text x="105" y="495" class="text-sub">Auditoras Financieras Senior - FinanCorp S.A.</text>
    <text x="105" y="512" class="text-muted" style="font-size:11px;">Dirección General de Reportes y Cumplimiento B2B</text>

    <rect x="910" y="460" width="170" height="22" rx="4" fill="#DCFCE7"/>
