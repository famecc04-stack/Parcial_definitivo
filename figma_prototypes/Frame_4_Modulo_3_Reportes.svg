    <text x="1080" y="255" text-anchor="end" class="text-body" style="font-weight:700; fill:#2B6CB0;">8,627.12 €</text>
    <text x="38" y="290" class="text-body">Laptop: 5,084.75 €</text>
    <text x="300" y="290" class="text-body">Smartphone: 2,542.37 €</text>
    <text x="600" y="290" class="text-body">Equipo Red: 555.56 €</text>
    <text x="850" y="290" class="text-body">Accesorio: 444.44 €</text>

