<svg width="1800" height="1200" viewBox="0 0 1800 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #1A365D; }
      .title-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #2B6CB0; }
      .actor-name { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .uc-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .uc-stereo { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #64748B; text-anchor: middle; }
      .inc-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #2563EB; text-anchor: middle; }
      .ext-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #D97706; text-anchor: middle; }
    </style>
    <marker id="uc-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polyline points="0 1, 8 5, 0 9" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    </marker>
    <marker id="ext-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polyline points="0 1, 8 5, 0 9" fill="none" stroke="#D97706" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1800" height="1200" fill="#F8FAFC"/>

  <!-- Header Banner -->
  <rect x="40" y="20" width="1720" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="40" y="20" width="8" height="70" rx="4" fill="#1A365D"/>
  <text x="65" y="50" class="title-main">FinanCorp S.A. — Sistema SERF: Diagrama de Casos de Uso del Sistema</text>
  <text x="65" y="74" class="title-sub">CASOS DE USO FUNCIONALES: CONFIGURACIÓN CORPORATIVA, SHENZHEN, FILIALES Y REPORTES FINANCIEROS GoF</text>

  <!-- Límite del Sistema -->
  <rect x="360" y="110" width="1020" height="1050" rx="12" fill="#FFFFFF" stroke="#1A365D" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="360" y="110" width="1020" height="40" rx="12" fill="#1A365D"/>
  <text x="870" y="136" style="font-family:'Segoe UI',sans-serif;font-size:16px;font-weight:800;fill:#FFFFFF;text-anchor:middle;">LÍMITE DEL SISTEMA: SERF WEB APPLICATION (FINANCORP S.A.)</text>

  <!-- ACTORES (Izquierda) -->
  <!-- 1. Administrador Financiero -->
  <g transform="translate(100, 200)">
    <circle cx="40" cy="20" r="16" fill="none" stroke="#1A365D" stroke-width="2.5"/>
    <line x1="40" y1="36" x2="40" y2="70" stroke="#1A365D" stroke-width="2.5"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#1A365D" stroke-width="2.5"/>
    <line x1="40" y1="70" x2="15" y2="105" stroke="#1A365D" stroke-width="2.5"/>
    <line x1="40" y1="70" x2="65" y2="105" stroke="#1A365D" stroke-width="2.5"/>
    <text x="40" y="130" class="actor-name">Administrador</text>
    <text x="40" y="146" class="actor-name">Financiero</text>
  </g>

  <!-- 2. Operador Shenzhen -->
  <g transform="translate(100, 480)">
    <circle cx="40" cy="20" r="16" fill="none" stroke="#0D9488" stroke-width="2.5"/>
    <line x1="40" y1="36" x2="40" y2="70" stroke="#0D9488" stroke-width="2.5"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#0D9488" stroke-width="2.5"/>
    <line x1="40" y1="70" x2="15" y2="105" stroke="#0D9488" stroke-width="2.5"/>
    <line x1="40" y1="70" x2="65" y2="105" stroke="#0D9488" stroke-width="2.5"/>
    <text x="40" y="130" class="actor-name" style="fill:#0D9488;">Operador Shenzhen</text>
    <text x="40" y="146" class="actor-name" style="fill:#0D9488;">(China)</text>
  </g>

  <!-- 3. Vendedor Filial -->
  <g transform="translate(100, 780)">
    <circle cx="40" cy="20" r="16" fill="none" stroke="#2B6CB0" stroke-width="2.5"/>
    <line x1="40" y1="36" x2="40" y2="70" stroke="#2B6CB0" stroke-width="2.5"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#2B6CB0" stroke-width="2.5"/>
    <line x1="40" y1="70" x2="15" y2="105" stroke="#2B6CB0" stroke-width="2.5"/>
    <line x1="40" y1="70" x2="65" y2="105" stroke="#2B6CB0" stroke-width="2.5"/>
    <text x="40" y="130" class="actor-name" style="fill:#2B6CB0;">Vendedor / Cajero</text>
    <text x="40" y="146" class="actor-name" style="fill:#2B6CB0;">Filial (Perú/Chile)</text>
  </g>

  <!-- ACTOR (Derecha: Auditoras) -->
  <g transform="translate(1520, 520)">
    <circle cx="40" cy="20" r="16" fill="none" stroke="#BE185D" stroke-width="2.5"/>
    <line x1="40" y1="36" x2="40" y2="70" stroke="#BE185D" stroke-width="2.5"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#BE185D" stroke-width="2.5"/>
    <line x1="40" y1="70" x2="15" y2="105" stroke="#BE185D" stroke-width="2.5"/>
    <line x1="40" y1="70" x2="65" y2="105" stroke="#BE185D" stroke-width="2.5"/>
    <text x="40" y="130" class="actor-name" style="fill:#BE185D;">Auditoras Financieras</text>
    <text x="40" y="146" class="actor-name" style="fill:#BE185D;">(Fabiola / Estefanía)</text>
  </g>

  <!-- CASOS DE USO (ÓVALOS) -->
  <!-- Grupo 1: Configuración -->
  <g id="uc-01">
    <ellipse cx="530" cy="200" rx="130" ry="32" fill="#F8FAFC" stroke="#1A365D" stroke-width="2"/>
    <text x="530" y="196" class="uc-txt">UC01: Consultar Tasas Oficiales</text>
    <text x="530" y="212" class="uc-stereo">(EUR, PEN, CNY, USD)</text>
  </g>

  <g id="uc-02">
    <ellipse cx="860" cy="200" rx="140" ry="32" fill="#F8FAFC" stroke="#1A365D" stroke-width="2"/>
    <text x="860" y="196" class="uc-txt">UC02: Actualizar Tasas Corporativas</text>
    <text x="860" y="212" class="uc-stereo">&lt;&lt;Singleton: Instancia Única&gt;&gt;</text>
  </g>

  <!-- Grupo 2: Shenzhen -->
  <g id="uc-03">
    <ellipse cx="530" cy="460" rx="130" ry="32" fill="#F8FAFC" stroke="#0D9488" stroke-width="2"/>
    <text x="530" y="456" class="uc-txt">UC03: Registrar Lote de Importación</text>
    <text x="530" y="472" class="uc-stereo">(Shenzhen - China)</text>
  </g>

  <g id="uc-04">
    <ellipse cx="860" cy="460" rx="140" ry="32" fill="#F8FAFC" stroke="#0D9488" stroke-width="2"/>
    <text x="860" y="456" class="uc-txt">UC04: Validar Costos y Stock</text>
    <text x="860" y="472" class="uc-stereo">&lt;&lt;Defensivo: IllegalArgumentException&gt;&gt;</text>
  </g>

  <g id="uc-05">
    <ellipse cx="530" cy="550" rx="130" ry="32" fill="#F8FAFC" stroke="#0D9488" stroke-width="2"/>
    <text x="530" y="554" class="uc-txt">UC05: Consultar Catálogo Consolidado</text>
  </g>

  <!-- Grupo 3: Ventas en Filiales -->
  <g id="uc-06">
    <ellipse cx="530" cy="740" rx="130" ry="32" fill="#F8FAFC" stroke="#2B6CB0" stroke-width="2"/>
    <text x="530" y="736" class="uc-txt">UC06: Emitir Venta en Filial</text>
    <text x="530" y="752" class="uc-stereo">(Perú: PEN / Chile: USD)</text>
  </g>

  <g id="uc-07">
    <ellipse cx="860" cy="740" rx="140" ry="32" fill="#F8FAFC" stroke="#2B6CB0" stroke-width="2"/>
    <text x="860" y="736" class="uc-txt">UC07: Control Atómico de Stock</text>
    <text x="860" y="752" class="uc-stereo">&lt;&lt;Defensivo: IllegalStateException&gt;&gt;</text>
  </g>

  <g id="uc-08">
    <ellipse cx="860" cy="830" rx="140" ry="32" fill="#F8FAFC" stroke="#2B6CB0" stroke-width="2"/>
    <text x="860" y="826" class="uc-txt">UC08: Conversión a Moneda Base</text>
    <text x="860" y="842" class="uc-stereo">(Unificación en EUR en tiempo real)</text>
  </g>

  <!-- Grupo 4: Reportes Financieros -->
  <g id="uc-09">
    <ellipse cx="530" cy="980" rx="130" ry="32" fill="#F8FAFC" stroke="#BE185D" stroke-width="2"/>
    <text x="530" y="976" class="uc-txt">UC09: Seleccionar Plantilla Base</text>
    <text x="530" y="992" class="uc-stereo">&lt;&lt;Prototype: Clonar Estructura&gt;&gt;</text>
  </g>

  <g id="uc-10">
    <ellipse cx="860" cy="980" rx="145" ry="36" fill="#F8FAFC" stroke="#BE185D" stroke-width="2.5"/>
    <text x="860" y="974" class="uc-txt">UC10: Generar Reporte Consolidado</text>
    <text x="860" y="992" class="uc-stereo">&lt;&lt;Facade + Builder + Composite&gt;&gt;</text>
  </g>

  <g id="uc-11">
    <ellipse cx="1200" cy="920" rx="130" ry="30" fill="#F8FAFC" stroke="#D97706" stroke-width="2"/>
    <text x="1200" y="916" class="uc-txt">UC11: Marca de Agua 'CONFIDENCIAL'</text>
    <text x="1200" y="932" class="uc-stereo">&lt;&lt;Decorator: Capa de Seguridad&gt;&gt;</text>
  </g>

  <g id="uc-12">
    <ellipse cx="1200" cy="1030" rx="130" ry="30" fill="#F8FAFC" stroke="#D97706" stroke-width="2"/>
    <text x="1200" y="1026" class="uc-txt">UC12: Firma Digital Cadillo / Orellana</text>
    <text x="1200" y="1042" class="uc-stereo">&lt;&lt;Decorator: Auditoría Certificada&gt;&gt;</text>
  </g>

  <!-- RELACIONES (LÍNEAS) -->
  <!-- Admin -> UC01, UC02 -->
  <line x1="180" y1="240" x2="400" y2="200" stroke="#1A365D" stroke-width="1.8"/>
  <line x1="180" y1="240" x2="720" y2="200" stroke="#1A365D" stroke-width="1.8"/>

  <!-- Importador -> UC03, UC05 -->
  <line x1="180" y1="520" x2="400" y2="460" stroke="#0D9488" stroke-width="1.8"/>
  <line x1="180" y1="520" x2="400" y2="550" stroke="#0D9488" stroke-width="1.8"/>

  <!-- Vendedor -> UC06 -->
  <line x1="180" y1="820" x2="400" y2="740" stroke="#2B6CB0" stroke-width="1.8"/>

  <!-- Auditoras -> UC09, UC10 -->
  <line x1="1520" y1="580" x2="660" y2="980" stroke="#BE185D" stroke-width="1.8"/>
  <line x1="1520" y1="580" x2="1005" y2="980" stroke="#BE185D" stroke-width="2"/>

  <!-- <<include>> UC03 -> UC04 -->
  <line x1="660" y1="460" x2="710" y2="460" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#uc-arrow)"/>
  <text x="685" y="450" class="inc-txt">&lt;&lt;include&gt;&gt;</text>

  <!-- <<include>> UC06 -> UC07 -->
  <line x1="660" y1="740" x2="710" y2="740" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#uc-arrow)"/>
  <text x="685" y="730" class="inc-txt">&lt;&lt;include&gt;&gt;</text>

  <!-- <<include>> UC06 -> UC08 -->
  <line x1="640" y1="765" x2="730" y2="815" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#uc-arrow)"/>
  <text x="690" y="805" class="inc-txt">&lt;&lt;include&gt;&gt;</text>

  <!-- <<include>> UC10 -> UC09 -->
  <line x1="715" y1="980" x2="670" y2="980" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#uc-arrow)"/>
  <text x="692" y="970" class="inc-txt">&lt;&lt;include&gt;&gt;</text>

  <!-- <<extend>> UC11 -> UC10 -->
  <line x1="1070" y1="935" x2="1000" y2="965" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ext-arrow)"/>
  <text x="1050" y="945" class="ext-txt">&lt;&lt;extend&gt;&gt;</text>

  <!-- <<extend>> UC12 -> UC10 -->
  <line x1="1070" y1="1015" x2="1000" y2="995" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ext-arrow)"/>
  <text x="1050" y="1015" class="ext-txt">&lt;&lt;extend&gt;&gt;</text>

</svg>