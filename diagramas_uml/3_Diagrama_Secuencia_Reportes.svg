<svg width="1800" height="1100" viewBox="0 0 1800 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #1A365D; }
      .title-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #2B6CB0; }
      .ll-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .ll-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; text-anchor: middle; }
      .msg-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1E293B; }
      .ret-txt { font-family: 'Consolas', monospace; font-size: 11px; font-weight: 600; fill: #2B6CB0; }
      .note-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #92400E; }
    </style>
    <marker id="seq-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 1, 9 5, 0 9" fill="#1A365D"/>
    </marker>
    <marker id="ret-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polyline points="0 1, 9 5, 0 9" fill="none" stroke="#2B6CB0" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1800" height="1100" fill="#F8FAFC"/>

  <!-- Header Banner -->
  <rect x="40" y="20" width="1720" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="40" y="20" width="8" height="70" rx="4" fill="#1A365D"/>
  <text x="65" y="50" class="title-main">FinanCorp S.A. — Diagrama de Secuencia: Generación Dinámica de Reportes</text>
  <text x="65" y="74" class="title-sub">COLABORACIÓN DINÁMICA DE PATRONES GoF: FACADE &#8594; PROTOTYPE &#8594; BUILDER &#8594; COMPOSITE &#8594; DECORATOR</text>

  <!-- LÍNEAS DE VIDA (LIFELINES) -->
  <!-- 1. Auditora / Web -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="160" height="48" rx="6" fill="#1A365D"/>
    <text x="80" y="22" class="ll-title">Auditora / Web</text>
    <text x="80" y="38" class="ll-sub">Frontend UI</text>
    <line x1="80" y1="48" x2="80" y2="920" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.8"/>
  </g>

  <!-- 2. ApiOperations -->
  <g transform="translate(260, 110)">
    <rect x="0" y="0" width="160" height="48" rx="6" fill="#475569"/>
    <text x="80" y="22" class="ll-title">ApiOperations</text>
    <text x="80" y="38" class="ll-sub">HTTP Controller</text>
    <line x1="80" y1="48" x2="80" y2="920" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.8"/>
  </g>

  <!-- 3. ReportFacade -->
  <g transform="translate(470, 110)">
    <rect x="0" y="0" width="170" height="48" rx="6" fill="#4F46E5"/>
    <text x="85" y="22" class="ll-title">ReportFacade</text>
    <text x="85" y="38" class="ll-sub">&lt;&lt;Facade: Entrada Única&gt;&gt;</text>
    <line x1="85" y1="48" x2="85" y2="920" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.8"/>
  </g>

  <!-- 4. ReportTemplate (Prototype) -->
  <g transform="translate(690, 110)">
    <rect x="0" y="0" width="170" height="48" rx="6" fill="#0D9488"/>
    <text x="85" y="22" class="ll-title">ReportTemplate</text>
    <text x="85" y="38" class="ll-sub">&lt;&lt;Prototype: Clonable&gt;&gt;</text>
    <line x1="85" y1="48" x2="85" y2="920" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.8"/>
  </g>

  <!-- 5. DataStore & Config -->
  <g transform="translate(910, 110)">
    <rect x="0" y="0" width="180" height="48" rx="6" fill="#0284C7"/>
    <text x="90" y="22" class="ll-title">DataStore &amp; Config</text>
    <text x="90" y="38" class="ll-sub">&lt;&lt;Singleton / Repositorio&gt;&gt;</text>
    <line x1="90" y1="48" x2="90" y2="920" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.8"/>
  </g>

  <!-- 6. StandardReportBuilder -->
  <g transform="translate(1140, 110)">
    <rect x="0" y="0" width="180" height="48" rx="6" fill="#B45309"/>
    <text x="90" y="22" class="ll-title">ReportBuilder</text>
    <text x="90" y="38" class="ll-sub">&lt;&lt;Builder: Ensamblado&gt;&gt;</text>
    <line x1="90" y1="48" x2="90" y2="920" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.8"/>
  </g>

  <!-- 7. ReportSection (Composite) -->
  <g transform="translate(1360, 110)">
    <rect x="0" y="0" width="170" height="48" rx="6" fill="#047857"/>
    <text x="85" y="22" class="ll-title">ReportSection</text>
    <text x="85" y="38" class="ll-sub">&lt;&lt;Composite: Árbol&gt;&gt;</text>
    <line x1="85" y1="48" x2="85" y2="920" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.8"/>
  </g>

  <!-- 8. ReportDecorator -->
  <g transform="translate(1570, 110)">
    <rect x="0" y="0" width="170" height="48" rx="6" fill="#BE185D"/>
    <text x="85" y="22" class="ll-title">ReportDecorator</text>
    <text x="85" y="38" class="ll-sub">&lt;&lt;Decorator: Capas&gt;&gt;</text>
    <line x1="85" y1="48" x2="85" y2="920" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.8"/>
  </g>

  <!-- MENSAJES DE SECUENCIA -->
  <!-- 1. Click en Generar Reporte -->
  <line x1="140" y1="200" x2="330" y2="200" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="145" y="192" class="msg-txt">1. POST /api/reports/generate {tplId: "trimestral", wm: true, sig: true}</text>

  <!-- 2. Api a Facade -->
  <line x1="340" y1="240" x2="545" y2="240" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="345" y="232" class="msg-txt">2. generateReport("trimestral", true, true)</text>

  <!-- 3. Facade a Prototype (Clonación) -->
  <line x1="555" y1="290" x2="765" y2="290" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="560" y="282" class="msg-txt">3. cloneReport()  &lt;&lt;Prototype: Reutiliza plantilla predefinida&gt;&gt;</text>

  <line x1="775" y1="330" x2="565" y2="330" stroke="#2B6CB0" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ret-arrow)"/>
  <text x="580" y="322" class="ret-txt">clonedTemplate: ReportTemplate (Instancia fresca clonada)</text>

  <!-- 4. Facade a DataStore y Singleton -->
  <line x1="555" y1="380" x2="990" y2="380" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="560" y="372" class="msg-txt">4. getAllProducts(), getAllSales() + convert(EUR)  &lt;&lt;Singleton: Tasas&gt;&gt;</text>

  <line x1="1000" y1="420" x2="565" y2="420" stroke="#2B6CB0" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ret-arrow)"/>
  <text x="580" y="412" class="ret-txt">List&lt;Product&gt;, List&lt;Sale&gt; consolidados en EUR</text>

  <!-- 5. Facade a Builder (Paso 1: Cabecera) -->
  <line x1="555" y1="470" x2="1220" y2="470" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="560" y="462" class="msg-txt">5. buildHeader(clonedTemplate)  &lt;&lt;Builder: Ensambla metadatos&gt;&gt;</text>

  <!-- 6. Facade a Builder (Paso 2: Consolidación) -->
  <line x1="555" y1="520" x2="1220" y2="520" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="560" y="512" class="msg-txt">6. buildConsolidatedData(products, sales)</text>

  <!-- 7. Builder a Composite (Construcción jerárquica) -->
  <line x1="1230" y1="570" x2="1435" y2="570" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="1235" y="562" class="msg-txt">7. new ReportSection(...) &amp; add(ReportItem)  &lt;&lt;Composite&gt;&gt;</text>

  <line x1="1445" y1="610" x2="1240" y2="610" stroke="#2B6CB0" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ret-arrow)"/>
  <text x="1255" y="602" class="ret-txt">rootSection (Árbol jerárquico: Filiales, Categorías, Shenzhen)</text>

  <!-- 8. Facade obtiene producto complejo -->
  <line x1="555" y1="660" x2="1220" y2="660" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="560" y="652" class="msg-txt">8. getResult(): FinancialReport  &lt;&lt;Builder: Producto final ensamblado&gt;&gt;</text>

  <line x1="1230" y1="700" x2="565" y2="700" stroke="#2B6CB0" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ret-arrow)"/>
  <text x="580" y="692" class="ret-txt">report: FinancialReport</text>

  <!-- 9. Facade aplica Decorators (Seguridad) -->
  <line x1="555" y1="750" x2="1645" y2="750" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="560" y="742" class="msg-txt">9. wrapWithWatermark("CONFIDENCIAL")  &lt;&lt;Decorator: Capa Visual&gt;&gt;</text>

  <line x1="555" y1="800" x2="1645" y2="800" stroke="#1A365D" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="560" y="792" class="msg-txt">10. wrapWithSignature("Fabiola Cadillo / Estefanía Orellana", hash)  &lt;&lt;Decorator: Firma&gt;&gt;</text>

  <!-- 10. Facade devuelve a Controller -->
  <line x1="545" y1="850" x2="350" y2="850" stroke="#2B6CB0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ret-arrow)"/>
  <text x="355" y="842" class="ret-txt">return decoratedReport (Reporte totalmente estructurado y protegido)</text>

  <!-- 11. Controller responde a Frontend -->
  <line x1="330" y1="900" x2="150" y2="900" stroke="#047857" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ret-arrow)"/>
  <text x="155" y="892" class="msg-txt" style="fill:#047857;">11. HTTP 200 OK: JSON renderizado en la página web con sellos y tablas en EUR</text>

</svg>